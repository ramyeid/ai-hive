[project]
name = "hive-console"
version = "0.1.0"
description = "Team Console: run and manage the Tech Lead, Dev and Reviewer agents from the browser and Slack."
requires-python = ">=3.10"   # the Claude Agent SDK needs 3.10+; uv downloads a suitable Python if needed
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "claude-agent-sdk>=0.2",
    "httpx>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",   # the sign-in form, when the console runs on a server
    "slack-sdk>=3.27",           # Slack (Socket Mode)
    "aiohttp>=3.9",              # Slack's Socket Mode connection
]

[tool.uv]
package = false   # an app run from this folder, not a library to install
