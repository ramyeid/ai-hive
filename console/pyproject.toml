[project]
name = "hive-console"
version = "0.1.0"
description = "Team Console: run and manage the Tech Lead, Dev and Reviewer agents from the browser."
requires-python = ">=3.10"   # the Claude Agent SDK needs 3.10+; uv downloads a suitable Python if needed
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "claude-agent-sdk>=0.2",
    "httpx>=0.27",
    "websockets>=12",
]

[tool.uv]
package = false   # an app run from this folder, not a library to install
