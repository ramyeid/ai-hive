<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='8' cy='16' r='5' fill='%234453C9'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230E7C66'/%3E%3Ccircle cx='24' cy='16' r='5' fill='%23B5620B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script>window.CONSOLE_TOKEN = "__TOKEN__";</script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Main">
      <a class="brand" href="#/">
        <span class="brand-dots" aria-hidden="true"><i class="pm"></i><i class="dev"></i><i class="reviewer"></i></span>
        Team console
      </a>
      <div class="rail-group">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/tasks" data-nav="tasks">Tasks</a>
        <a href="#/inbox" data-nav="inbox">Inbox <span class="badge" id="inbox-badge" hidden></span></a>
        <a href="#/history" data-nav="history">History</a>
      </div>
      <div class="rail-group">
        <h2 class="rail-heading">Agents</h2>
        <div id="rail-agents"></div>
      </div>
      <div class="rail-foot">
        <a href="#/settings" data-nav="settings">Settings</a>
        <span class="conn" id="conn" title="Live connection to the console server">Connecting…</span>
      </div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
