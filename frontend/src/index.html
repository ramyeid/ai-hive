<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hive</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/hive-logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#76a891">
  <link rel="stylesheet" href="/static/styles.css">
  <script>window.CONSOLE_TOKEN = "__TOKEN__";
    try { const t = localStorage.getItem("theme"); if (t && t !== "system") document.documentElement.dataset.theme = t; } catch {}</script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Main">
      <div class="rail-top"><a class="brand" href="#/" title="Hive"><img src="/assets/hive-logo.svg" alt="" width="28" height="28"><span class="label">Hive</span></a>
        <button class="icon-btn rail-collapse" data-action="toggle-rail" aria-label="Collapse the sidebar" title="Collapse the sidebar ([)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.5"/><path d="M6 2.8v10.4M10.5 6.2 8.7 8l1.8 1.8"/></svg></button></div>
      <div class="rail-group">
        <a href="#/" data-nav="overview" title="Home"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.2 8 2.8l5.5 4.4V13.5h-11z"/><path d="M6.5 13.5v-3.5h3v3.5"/></svg><span class="label">Home</span><span class="badge" id="home-badge" hidden></span></a>
        <a href="#/tasks" data-nav="tasks" title="Board"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="2.5" width="3.6" height="11" rx="1"/><rect x="6.2" y="2.5" width="3.6" height="7.5" rx="1"/><rect x="10.6" y="2.5" width="3.6" height="5" rx="1"/></svg><span class="label">Board</span></a>
        <a href="#/history" data-nav="history" title="Activity"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3l2-5 3 9 2-4h3"/></svg><span class="label">Activity</span></a>
      </div>
      <section class="rail-section" data-section="orchestrator">
        <button class="rail-toggle" data-action="toggle-section" aria-expanded="true">Orchestrator</button>
        <div class="rail-body" id="rail-orchestrator"></div>
      </section>
      <section class="rail-section" data-section="team">
        <button class="rail-toggle" data-action="toggle-section" aria-expanded="true">Team</button>
        <div class="rail-body" id="rail-team"></div>
      </section>
      <section class="rail-section" data-section="coach">
        <button class="rail-toggle" data-action="toggle-section" aria-expanded="true">Coach</button>
        <div class="rail-body">
          <div id="rail-coach"></div>
          <a href="#/improvements" data-nav="improvements" title="Improvements"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.6 4.1 4.1 1.6-4.1 1.6L8 13.2l-1.6-4.1-4.1-1.6 4.1-1.6z"/></svg><span class="label">Improvements</span><span class="badge soft" id="improvements-badge" hidden></span></a>
          <a href="#/team" data-nav="team" title="Team history"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.5"/></svg><span class="label">Team history</span></a>
        </div>
      </section>
      <section class="rail-section" data-section="library">
        <button class="rail-toggle" data-action="toggle-section" aria-expanded="true">Library</button>
        <div class="rail-body"><a href="#/knowledge" data-nav="knowledge" title="Knowledge"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 3h4.1A1.7 1.7 0 0 1 8 4.7v8.6a1.4 1.4 0 0 0-1.4-1.3H2.2z"/><path d="M13.8 3H9.7A1.7 1.7 0 0 0 8 4.7v8.6a1.4 1.4 0 0 1 1.4-1.3h4.4z"/></svg><span class="label">Knowledge</span></a></div>
      </section>
      <div class="rail-foot">
        <a href="#/settings" data-nav="settings" title="Settings"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h6.5M12 4.5h2M2 11.5h2M7.5 11.5H14"/><circle cx="10.2" cy="4.5" r="1.7"/><circle cx="5.8" cy="11.5" r="1.7"/></svg><span class="label">Settings</span></a>
        <a href="#/terminal" data-nav="terminal" id="nav-terminal" title="Terminal" hidden><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.5"/><path d="M4.5 6.2 6.6 8l-2.1 1.8M8.5 10h3"/></svg><span class="label">Terminal</span></a>
        <span class="conn" id="conn" title="Live connection to the console server">Connecting…</span>
      </div>
    </nav>
    <div class="scrim" data-action="close-rail" hidden></div>
    <div class="body">
      <header class="topbar">
        <button class="icon-btn rail-open" data-action="open-rail" aria-label="Open the menu">☰</button>
        <nav class="crumb" id="crumb" aria-label="You are here"></nav>
        <button class="jump" data-action="jump" aria-label="Jump to a task, agent or page">
          <span>Jump to a task, agent or page…</span><kbd>⌘K</kbd></button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <button class="ask-pill" id="ask-pill" data-action="open-drawer" hidden>
    <span class="avatar orchestrator">O</span><span>Ask the Orchestrator…</span><kbd>/</kbd></button>
  <aside class="drawer" id="drawer" aria-label="Orchestrator" hidden></aside>

  <dialog class="jump-dialog" id="jump-dialog" aria-label="Jump to">
    <input type="text" id="jump-input" placeholder="Type a task (012), an agent (Nabil) or a page" autocomplete="off" spellcheck="false">
    <ul id="jump-list" role="listbox"></ul>
  </dialog>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav="overview">Home <span class="badge" id="home-badge-tab" hidden></span></a>
    <a href="#/tasks" data-nav="tasks">Board</a>
    <a href="#/agents/orchestrator" data-nav="orchestrator-tab">Orchestrator</a>
    <button data-action="open-rail">Menu</button>
  </nav>

  <div id="term-parking" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
