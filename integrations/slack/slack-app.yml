# Slack app for the Team Console. Create it at https://api.slack.com/apps → Create New App → From a manifest,
# pick your workspace, paste this file. Rename it if you like (one app per running console).
# Then: Basic Information → App-Level Tokens → Generate (scope connections:write) → the xapp-… token;
#       Install App → Install to Workspace → the xoxb-… bot token. Paste both in the console's Settings → Slack.
display_information:
  name: AI Hive Team Console
  description: Talk to your agent team (Orchestrator, Tech Lead, Dev, Reviewer, Coach) and approve their requests.
  background_color: "#18202a"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: AI Hive Team Console
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # answers, hand-offs, approval requests
      - im:history          # read your direct messages to the app
      - im:read
      - im:write            # open a direct message with you for notifications
      - app_mentions:read   # @-mentions in a channel
      - channels:history    # thread replies in a public channel you invite it to
      - groups:history      # … or a private one
      - reactions:write     # 👀 on messages it passed on
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.channels    # replies in a task's thread, if notifications go to a channel
      - message.groups
      - app_mention
  interactivity:
    is_enabled: true        # Allow / Deny and hand-off buttons
  org_deploy_enabled: false
  socket_mode_enabled: true # the console connects out to Slack: no public address needed
  token_rotation_enabled: false
